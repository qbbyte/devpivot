<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3370ff"/>
    </marker>
    <marker id="arrowMuted" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#86909c"/>
    </marker>
    <style>
      .box { fill:#eef3ff; stroke:#c9d6ff; stroke-width:1.5; }
      .boxStrong { fill:#3370ff; }
      .title { fill:#1d2129; font-size:20px; font-weight:700; }
      .lbl { fill:#1d2129; font-size:13px; font-weight:600; }
      .sub { fill:#5b6573; font-size:11px; }
      .pill { fill:#ffffff; stroke:#3370ff; stroke-width:1.5; }
      .pillTxt { fill:#3370ff; font-size:12px; font-weight:700; }
      .edge { fill:none; stroke:#3370ff; stroke-width:2; }
      .edgeMuted { fill:none; stroke:#86909c; stroke-width:1.8; stroke-dasharray:5 4; }
      .cap { fill:#3370ff; font-size:11px; font-weight:600; }
      .capMuted { fill:#86909c; font-size:11px; font-weight:600; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" class="title">devPivot 架构与数据流</text>

  <!-- 门户前端 -->
  <rect x="20" y="150" width="172" height="92" rx="10" class="box"/>
  <text x="106" y="184" text-anchor="middle" class="lbl">门户前端</text>
  <text x="106" y="204" text-anchor="middle" class="sub">Vue 3 + Element Plus</text>
  <text x="106" y="222" text-anchor="middle" class="sub">工作台 / 阶段页</text>

  <!-- 产出 -->
  <rect x="708" y="150" width="172" height="92" rx="10" class="box"/>
  <text x="794" y="178" text-anchor="middle" class="lbl">交付产出</text>
  <text x="794" y="198" text-anchor="middle" class="sub">需求文档 / PRD</text>
  <text x="794" y="216" text-anchor="middle" class="sub">原型 / 库表 SQL</text>

  <!-- 流水线容器 -->
  <rect x="212" y="118" width="476" height="156" rx="14" class="boxStrong" opacity="0.08"/>
  <rect x="212" y="118" width="476" height="156" rx="14" fill="none" stroke="#3370ff" stroke-width="1.5" opacity="0.5"/>
  <text x="450" y="142" text-anchor="middle" class="lbl">7 阶段 AI 流水线</text>

  <!-- 7 pills -->
  <g>
    <rect x="236" y="186" width="56" height="42" rx="9" class="pill"/><text x="264" y="212" text-anchor="middle" class="pillTxt">REQ</text>
    <rect x="298" y="186" width="56" height="42" rx="9" class="pill"/><text x="326" y="212" text-anchor="middle" class="pillTxt">CL</text>
    <rect x="360" y="186" width="56" height="42" rx="9" class="pill"/><text x="388" y="212" text-anchor="middle" class="pillTxt">PRD</text>
    <rect x="422" y="186" width="56" height="42" rx="9" class="pill"/><text x="450" y="212" text-anchor="middle" class="pillTxt">PRO</text>
    <rect x="484" y="186" width="56" height="42" rx="9" class="pill"/><text x="512" y="212" text-anchor="middle" class="pillTxt">TECH</text>
    <rect x="546" y="186" width="56" height="42" rx="9" class="pill"/><text x="574" y="212" text-anchor="middle" class="pillTxt">DB</text>
    <rect x="608" y="186" width="56" height="42" rx="9" class="pill"/><text x="636" y="212" text-anchor="middle" class="pillTxt">DONE</text>
    <!-- connectors -->
    <line x1="292" y1="207" x2="298" y2="207" class="edge" marker-end="url(#arrow)"/>
    <line x1="354" y1="207" x2="360" y2="207" class="edge" marker-end="url(#arrow)"/>
    <line x1="416" y1="207" x2="422" y2="207" class="edge" marker-end="url(#arrow)"/>
    <line x1="478" y1="207" x2="484" y2="207" class="edge" marker-end="url(#arrow)"/>
    <line x1="540" y1="207" x2="546" y2="207" class="edge" marker-end="url(#arrow)"/>
    <line x1="602" y1="207" x2="608" y2="207" class="edge" marker-end="url(#arrow)"/>
  </g>
  <text x="450" y="262" text-anchor="middle" class="sub">每段 generate 前自动回源上游上下文</text>

  <!-- 主流程箭头 -->
  <line x1="192" y1="196" x2="212" y2="196" class="edge" marker-end="url(#arrow)"/>
  <text x="202" y="188" text-anchor="middle" class="capMuted">输入: 需求</text>
  <line x1="688" y1="196" x2="708" y2="196" class="edge" marker-end="url(#arrow)"/>
  <text x="698" y="188" text-anchor="middle" class="capMuted">产出</text>

  <!-- 知识库 -->
  <rect x="250" y="322" width="300" height="82" rx="10" class="box"/>
  <text x="400" y="350" text-anchor="middle" class="lbl">知识库 RAG</text>
  <text x="400" y="370" text-anchor="middle" class="sub">MySQL FULLTEXT + ngram 中文分词</text>
  <text x="400" y="388" text-anchor="middle" class="sub">本项目库 + 组织共享库(-1)</text>
  <line x1="400" y1="322" x2="400" y2="274" class="edge" marker-end="url(#arrow)"/>
  <text x="408" y="302" class="cap">kbContext 注入</text>

  <!-- 基础设施 -->
  <rect x="600" y="322" width="180" height="82" rx="10" class="box"/>
  <text x="690" y="356" text-anchor="middle" class="lbl">基础设施</text>
  <text x="690" y="376" text-anchor="middle" class="sub">MySQL 8.0 / Redis 7</text>
  <text x="690" y="394" text-anchor="middle" class="sub">(Redis 强依赖)</text>
  <line x1="690" y1="322" x2="690" y2="276" class="edgeMuted" marker-end="url(#arrowMuted)"/>
  <text x="612" y="300" class="capMuted">持久化</text>
</svg>
